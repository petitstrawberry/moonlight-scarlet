[package]
name = "moonlight-control"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable Sunshine/GameStream control plane for Moonlight Scarlet"

[dependencies]
aes = "0.8.4"
hex = "0.4.3"
rand = "0.8.5"
rcgen = { version = "0.13.2", default-features = false, features = ["pem", "ring"] }
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls-manual-roots"] }
roxmltree = "0.21.1"
rsa = { version = "0.9.10", features = ["sha2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = { version = "0.10.6", features = ["oid"] }
sha2 = { version = "0.10.9", features = ["oid"] }
thiserror = "2.0.16"
x509-cert = "0.2.5"

[dev-dependencies]
moonlight-sys.workspace = true
tempfile = "3.23.0"

[lints]
workspace = true
